name: Gerar amostras de voz

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/voice_samples.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar gerador de voz
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip

      - name: Gerar todas as vozes pt-BR disponíveis
        run: |
          rm -rf voice_samples
          mkdir -p voice_samples
          python - <<'PY'
          import asyncio
          import json
          import re
          from pathlib import Path
          import edge_tts

          TEXT = (
              "SimonSports, simplesmente o melhor. "
              "Confira agora o resultado oficial da Dupla Sena, "
              "concurso dois mil novecentos e dezessete."
          )
          OUT = Path("voice_samples")

          def slug(text):
              text = re.sub(r"[^A-Za-z0-9]+", "_", text).strip("_")
              return text.lower()

          async def main():
              voices = await edge_tts.list_voices()
              selected = [v for v in voices if v.get("Locale") == "pt-BR"]
              selected.sort(key=lambda v: (v.get("Gender", ""), v.get("ShortName", "")))
              if not selected:
                  raise RuntimeError("Nenhuma voz pt-BR encontrada")

              readme = [
                  "Amostras de voz do Portal SimonSports",
                  "",
                  "Todas leem exatamente o mesmo texto.",
                  "",
              ]
              manifest = []
              for index, voice in enumerate(selected, start=1):
                  short = voice["ShortName"]
                  gender = voice.get("Gender", "")
                  friendly = voice.get("FriendlyName", short)
                  filename = f"{index:02d}_{slug(short)}.mp3"
                  await edge_tts.Communicate(
                      text=TEXT,
                      voice=short,
                      rate="-2%",
                      pitch="-1Hz",
                  ).save(str(OUT / filename))
                  readme.append(f"{index:02d} | {short} | {gender} | {friendly}")
                  manifest.append({
                      "numero": index,
                      "arquivo": filename,
                      "voz": short,
                      "genero": gender,
                      "nome": friendly,
                  })

              (OUT / "README.txt").write_text("\n".join(readme) + "\n", encoding="utf-8")
              (OUT / "manifest.json").write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )

          asyncio.run(main())
          PY

          for f in voice_samples/*.mp3; do
            tmp="${f%.mp3}_norm.mp3"
            ffmpeg -y -i "$f" -af loudnorm=I=-16:TP=-1.5:LRA=11 -codec:a libmp3lame -b:a 128k "$tmp"
            mv "$tmp" "$f"
          done

          cd voice_samples
          zip -9 pacote_todas_vozes_ptbr_simonsports.zip ./*.mp3 README.txt manifest.json
          cd ..

      - name: Gravar amostras no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice_samples
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas amostras."
          else
            git commit -m "Gera todas as vozes brasileiras para aprovação"
            git push
          fi
