name: Publicação de Vídeos (YouTube)

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Gerar prévia ou processar a fila e publicar"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - publish
  push:
    branches:
      - main
    paths:
      - gerador_video.py
      - gerador_video_v5.py
      - gerador_video_v6.py
      - gerador_video_v7.py
      - gerador_video_v8.py
      - gerador_video_v9.py
      - audio_identity_v8.py
      - audio_identity_v9.py
      - video_visual_v3.py
      - video_visual_v5.py
      - video_visual_v6.py
      - video_preview.py
      - video_queue.py
      - video_queue_auto.py
      - post_video.py
      - youtube_auth.py
      - youtube_upload.py
      - requirements.txt
      - .github/workflows/videos_publish.yml
  schedule:
    - cron: "15 2 * * *"

concurrency:
  group: youtube-loterias-publicacao
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Gerar prévia V9 sem locução de 60 segundos
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg, fontes e dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir -r requirements.txt

      - name: Validar módulos
        run: |
          python -m py_compile gerador_video.py gerador_video_v5.py gerador_video_v6.py gerador_video_v7.py gerador_video_v8.py gerador_video_v9.py audio_identity_v8.py audio_identity_v9.py video_visual_v3.py video_visual_v5.py video_visual_v6.py video_preview.py

      - name: Gerar vídeo de prévia
        env:
          VIDEO_WIDTH: "1080"
          VIDEO_HEIGHT: "1920"
          VIDEO_FPS: "30"
          DURACAO_VIDEO: "60"
        run: |
          rm -rf preview_output
          python video_preview.py --source data/to_publish.json --output-dir preview_output --duration 60
          ls -lh preview_output
          test -n "$(find preview_output -maxdepth 1 -name '*.mp4' -print -quit)"

      - name: Disponibilizar artefato da prévia
        uses: actions/upload-artifact@v4
        with:
          name: previa-youtube-v9-sem-locucao-60s-${{ github.run_number }}
          path: |
            preview_output/*.mp4
            preview_output/*.png
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Gerar e publicar Shorts no YouTube
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.modo == 'publish') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir -r requirements.txt

      - name: Validar código e configuração obrigatória
        env:
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
          COFRE_SHEET_ID: ${{ secrets.COFRE_SHEET_ID || vars.COFRE_SHEET_ID }}
        run: |
          python -m py_compile gerador_video.py gerador_video_v5.py gerador_video_v6.py gerador_video_v7.py gerador_video_v8.py gerador_video_v9.py audio_identity_v8.py audio_identity_v9.py video_visual_v3.py video_visual_v5.py video_visual_v6.py video_queue.py video_queue_auto.py post_video.py youtube_auth.py youtube_upload.py
          python - <<'PY'
          import json
          import os
          import sys

          google_json = (os.getenv("GOOGLE_SERVICE_JSON") or "").strip()
          cofre_id = (os.getenv("COFRE_SHEET_ID") or "").strip()
          missing = []
          if not google_json:
              missing.append("GOOGLE_SERVICE_JSON")
          if not cofre_id:
              missing.append("COFRE_SHEET_ID")
          if missing:
              print("Faltam configurações:", ", ".join(missing))
              sys.exit(1)
          try:
              json.loads(google_json)
          except Exception as exc:
              print("GOOGLE_SERVICE_JSON inválido:", exc)
              sys.exit(1)
          print("Código e configurações obrigatórias validados.")
          PY

      - name: Executar fila automática e publicar
        env:
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || '16NcdSwX6q_EQ2XjS1KNIBe6C3Piq-lCBgA38TMszXCI' }}
          SHEET_TAB: ${{ vars.SHEET_TAB || 'ImportadosBlogger2' }}
          COFRE_SHEET_ID: ${{ secrets.COFRE_SHEET_ID || vars.COFRE_SHEET_ID }}
          COFRE_ABA_CRED: ${{ vars.COFRE_ABA_CRED || 'Credenciais_Rede' }}
          ENFILEIRADO_VIDEOS_COL: ${{ vars.ENFILEIRADO_VIDEOS_COL || 'Enfileirado_Videos' }}
          PUBLICADO_YT_COL: ${{ vars.PUBLICADO_YT_COL || 'Publicado_Youtube' }}
          MAX_VIDEOS_RODADA: ${{ vars.MAX_VIDEOS_RODADA || '1' }}
          PAUSA_ENTRE_VIDEOS: ${{ vars.PAUSA_ENTRE_VIDEOS || '2.0' }}
          AUTO_ENQUEUE_VIDEOS: "true"
          VIDEO_BACKLOG_DAYS: ${{ vars.VIDEO_BACKLOG_DAYS || '7' }}
          ALLOW_OLD_QUEUED_VIDEOS: "false"
          DRY_RUN_VIDEOS: "false"
          DURACAO_VIDEO: "60"
          VIDEO_WIDTH: "1080"
          VIDEO_HEIGHT: "1920"
          VIDEO_FPS: "30"
          TZ: America/Sao_Paulo
        run: |
          mkdir -p output
          python video_queue_auto.py

      - name: Guardar vídeos gerados para auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-youtube-gerados-${{ github.run_number }}
          path: output/*.mp4
          if-no-files-found: ignore
          retention-days: 7
