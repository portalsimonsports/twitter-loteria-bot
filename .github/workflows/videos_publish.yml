name: Publicação de Vídeos (YouTube)

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Escolha prévia para gerar MP4 sem publicar ou publicar para processar a fila"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - publish
  push:
    branches:
      - main
    paths:
      - gerador_video.py
      - video_preview.py
      - video_queue.py
      - post_video.py
      - youtube_auth.py
      - youtube_upload.py
      - .github/workflows/videos_publish.yml
  schedule:
    - cron: "*/20 * * * *"

concurrency:
  group: publish-videos-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Gerar prévia para aprovação
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.modo == 'preview') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg, fontes e Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install "Pillow>=10.4.0"

      - name: Gerar vídeo de prévia
        run: |
          rm -rf preview_output
          python video_preview.py --source data/to_publish.json --output-dir preview_output --duration 8
          ls -lh preview_output
          test -n "$(find preview_output -maxdepth 1 -name '*.mp4' -print -quit)"

      - name: Publicar artefato da prévia
        uses: actions/upload-artifact@v4
        with:
          name: previa-youtube-loterias-${{ github.run_number }}
          path: |
            preview_output/*.mp4
            preview_output/*.png
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Processar fila e publicar no YouTube
    if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.modo == 'publish')) && vars.ENABLE_VIDEOS == 'true' && vars.YOUTUBE_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir -r requirements.txt

      - name: Validar configuração obrigatória
        env:
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
          COFRE_SHEET_ID: ${{ secrets.COFRE_SHEET_ID || vars.COFRE_SHEET_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          google_json = (os.getenv("GOOGLE_SERVICE_JSON") or "").strip()
          cofre_id = (os.getenv("COFRE_SHEET_ID") or "").strip()
          missing = []
          if not google_json:
              missing.append("GOOGLE_SERVICE_JSON")
          if not cofre_id:
              missing.append("COFRE_SHEET_ID")
          if missing:
              print("Faltam configurações:", ", ".join(missing))
              sys.exit(1)
          try:
              json.loads(google_json)
          except Exception as exc:
              print("GOOGLE_SERVICE_JSON inválido:", exc)
              sys.exit(1)
          print("Configuração obrigatória validada.")
          PY

      - name: Executar fila de vídeos
        env:
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || '16NcdSwX6q_EQ2XjS1KNIBe6C3Piq-lCBgA38TMszXCI' }}
          SHEET_TAB: ${{ vars.SHEET_TAB || 'ImportadosBlogger2' }}
          COFRE_SHEET_ID: ${{ secrets.COFRE_SHEET_ID || vars.COFRE_SHEET_ID }}
          COFRE_ABA_CRED: ${{ vars.COFRE_ABA_CRED || 'Credenciais_Rede' }}
          ENFILEIRADO_VIDEOS_COL: ${{ vars.ENFILEIRADO_VIDEOS_COL || 'Enfileirado_Videos' }}
          PUBLICADO_YT_COL: ${{ vars.PUBLICADO_YT_COL || 'Publicado_Youtube' }}
          MAX_VIDEOS_RODADA: ${{ vars.MAX_VIDEOS_RODADA || '10' }}
          PAUSA_ENTRE_VIDEOS: ${{ vars.PAUSA_ENTRE_VIDEOS || '2.0' }}
          DRY_RUN_VIDEOS: ${{ vars.DRY_RUN_VIDEOS || 'false' }}
          DURACAO_VIDEO: ${{ vars.DURACAO_VIDEO || '8' }}
          TZ: America/Sao_Paulo
        run: |
          python video_queue.py
