name: Referência legada de vídeos individuais — sem publicação

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-individual:
    name: Gerar prévia individual apenas para auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation2
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir -r requirements.txt

      - name: Validar módulos individuais legados
        run: |
          python -m py_compile \
            gerador_pacote_v18.py voice_narration_v18.py lottery_result_v18.py \
            loteca_video_v18.py loteca_columns_v18.py loteca_visual_aprovado_v18.py \
            loteca_release_v18.py video_preview.py post_video.py youtube_upload.py

      - name: Gerar prévia sem enviar ao YouTube
        env:
          VIDEO_WIDTH: "1080"
          VIDEO_HEIGHT: "1920"
          VIDEO_FPS: "30"
        run: |
          rm -rf preview_output
          python video_preview.py --source data/to_publish.json --output-dir preview_output --duration 60
          ls -lh preview_output

      - name: Disponibilizar prévia individual
        uses: actions/upload-artifact@v4
        with:
          name: previa-individual-legada-sem-publicacao-${{ github.run_number }}
          path: |
            preview_output/*.mp4
            preview_output/*.png
          if-no-files-found: error
          retention-days: 7
