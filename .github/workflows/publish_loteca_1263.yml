name: Referência legada da Loteca 1263 — sem publicação

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-loteca-1263-referencia-legada
  cancel-in-progress: true

jobs:
  validar:
    name: Validar e renderizar referência sem enviar ao YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg, fontes e dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation2
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir -r requirements.txt

      - name: Validar módulos da referência histórica
        run: |
          python -m py_compile \
            loteca_preview_v18.py gerador_pacote_v18.py loteca_release_v18.py \
            loteca_columns_v18.py loteca_visual_aprovado_v18.py loteca_video_v18.py \
            lottery_result_v18.py voice_narration_v18.py
          python - <<'PY'
          from loteca_preview_v18 import SAMPLE
          from loteca_release_v18 import _normalize_loteca_speech
          from lottery_result_v18 import parse_lottery_result

          games = parse_lottery_result("Loteca", SAMPLE["numeros"]).loteca_games
          assert len(games) == 14
          assert "França" in _normalize_loteca_speech("Jogo 1. Franca, 4.")
          assert "Simon Sports" in _normalize_loteca_speech("Portal SimonSports")
          print("Referência histórica da Loteca 1263 validada sem publicação.")
          PY

      - name: Gerar somente prévia para auditoria
        env:
          VIDEO_FPS: "30"
        run: |
          rm -rf preview_loteca_1263_legada
          python loteca_preview_v18.py --output-dir preview_loteca_1263_legada
          ls -lh preview_loteca_1263_legada

      - name: Guardar referência histórica
        uses: actions/upload-artifact@v4
        with:
          name: referencia-loteca-1263-sem-publicacao-${{ github.run_number }}
          path: |
            preview_loteca_1263_legada/*.mp4
            preview_loteca_1263_legada/*.png
          if-no-files-found: error
          retention-days: 7
