name: Publicar Ho'oponopono no YouTube

on:
  push:
    paths:
      - '.github/workflows/publicar_hooponopono.yml'
  workflow_dispatch:

concurrency:
  group: publish-hooponopono-youtube
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar FFmpeg e dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install --no-cache-dir -r requirements.txt
      - name: Publicar Ho'oponopono
        env:
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
          COFRE_SHEET_ID: ${{ secrets.COFRE_SHEET_ID || vars.COFRE_SHEET_ID }}
          COFRE_ABA_CRED: ${{ secrets.COFRE_ABA_CRED || vars.COFRE_ABA_CRED || 'Credenciais_Rede' }}
          COFRE_ABA_CANAIS: ${{ secrets.COFRE_ABA_CANAIS || vars.COFRE_ABA_CANAIS || 'Redes_Sociais_Canais' }}
        run: python publish_hooponopono_once.py
