name: Gerar amostras de apresentadores

on:
  push:
    branches:
      - main
    paths:
      - voice_samples_request.txt
      - generate_presenter_samples.py
      - .github/workflows/generate_presenter_samples.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Gerar e gravar amostras válidas
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar gerador de voz
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir edge-tts

      - name: Gerar amostras
        run: |
          python generate_presenter_samples.py
          ls -lh voice_samples_candidates
          ls -lh amostras_apresentadores_adicionais_simonsports.zip

      - name: Gravar arquivos no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice_samples_candidates amostras_apresentadores_adicionais_simonsports.zip
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas amostras."
          else
            git commit -m "Gera amostras adicionais de apresentadores"
            git push
          fi

      - name: Disponibilizar pacote
        uses: actions/upload-artifact@v4
        with:
          name: amostras-apresentadores-adicionais-simonsports-${{ github.run_number }}
          path: |
            voice_samples_candidates/*.mp3
            voice_samples_candidates/*.txt
            voice_samples_candidates/*.json
            amostras_apresentadores_adicionais_simonsports.zip
          if-no-files-found: error
          retention-days: 14
