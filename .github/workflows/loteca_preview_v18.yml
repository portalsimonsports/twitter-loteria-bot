name: Prévia Rápida Loteca V18

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - loteca_preview_v18.py
      - loteca_video_v18.py
      - loteca_columns_v18.py
      - lottery_result_v18.py
      - voice_narration_v18.py
      - gerador_pacote_v18.py
      - audio_identity_v9.py
      - requirements.txt
      - .github/workflows/loteca_preview_v18.yml

permissions:
  contents: read

jobs:
  gerar-loteca:
    name: Gerar vídeos da Loteca 1263 — colunas 1 X 2
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg, fontes e dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation2
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir -r requirements.txt

      - name: Validar gerador e colunas da Loteca
        run: |
          python -m py_compile loteca_preview_v18.py loteca_video_v18.py loteca_columns_v18.py lottery_result_v18.py voice_narration_v18.py gerador_pacote_v18.py
          python - <<'PY'
          from loteca_columns_v18 import column_code, game_speech
          from lottery_result_v18 import LotecaGame

          assert column_code(LotecaGame(1, "A", "B", 2, 1)) == "1"
          assert column_code(LotecaGame(2, "A", "B", 1, 1)) == "X"
          assert column_code(LotecaGame(3, "A", "B", 0, 2)) == "2"
          assert "Vitória" not in game_speech(LotecaGame(1, "A", "B", 2, 1))
          assert "Empate" not in game_speech(LotecaGame(2, "A", "B", 1, 1))
          print("Loteca validada: placar e resultado por colunas 1, X e 2.")
          PY

      - name: Gerar Short, vídeo completo e pôster
        env:
          VIDEO_FPS: "30"
        run: |
          rm -rf preview_loteca_v18
          python loteca_preview_v18.py --output-dir preview_loteca_v18
          ls -lh preview_loteca_v18
          test -n "$(find preview_loteca_v18 -maxdepth 1 -name 'short_loteca_*_90s_voz_v18.mp4' -print -quit)"
          test -n "$(find preview_loteca_v18 -maxdepth 1 -name 'video_completo_loteca_*_270s_dialogo_v18.mp4' -print -quit)"
          test -n "$(find preview_loteca_v18 -maxdepth 1 -name 'poster_loteca_*_v18.png' -print -quit)"

      - name: Disponibilizar vídeos da Loteca
        uses: actions/upload-artifact@v4
        with:
          name: videos-loteca-v18-colunas-1-x-2-${{ github.run_number }}
          path: |
            preview_loteca_v18/*.mp4
            preview_loteca_v18/*.png
          if-no-files-found: error
          retention-days: 14
