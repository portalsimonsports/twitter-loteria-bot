name: Prévia Rápida Loteca V18

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - loteca_preview_v18.py
      - loteca_video_v18.py
      - loteca_columns_v18.py
      - loteca_visual_aprovado_v18.py
      - loteca_release_v18.py
      - lottery_result_v18.py
      - voice_narration_v18.py
      - gerador_pacote_v18.py
      - audio_identity_v9.py
      - requirements.txt
      - .github/workflows/loteca_preview_v18.yml

permissions:
  contents: read

jobs:
  gerar-loteca:
    name: Gerar Loteca 1263 — intervalo reduzido para aprovação
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg, fontes e dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation2
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir -r requirements.txt

      - name: Validar roteiro, pronúncia, ritmo e visual da Loteca
        run: |
          python -m py_compile loteca_preview_v18.py loteca_video_v18.py loteca_columns_v18.py loteca_visual_aprovado_v18.py loteca_release_v18.py lottery_result_v18.py voice_narration_v18.py gerador_pacote_v18.py
          python - <<'PY'
          from loteca_columns_v18 import FINAL_SHORT_DURATION, game_speech, result_label
          from loteca_release_v18 import (
              FINAL_FULL_DURATION,
              FINAL_FULL_GAME_SLOT,
              _full_segments_natural,
              _game_start,
              _normalize_loteca_speech,
              _short_segments_natural,
          )
          from loteca_visual_aprovado_v18 import install_visual_aprovado
          from lottery_result_v18 import LotecaGame

          mandante = LotecaGame(1, "Mandante", "Visitante", 2, 1)
          empate = LotecaGame(2, "Mandante", "Visitante", 1, 1)
          visitante = LotecaGame(3, "Mandante", "Visitante", 0, 2)
          franca = LotecaGame(1, "FRANCA", "INGLATERRA", 4, 6)
          games = [franca] + [LotecaGame(i, f"Mandante {i}", f"Visitante {i}", 1, 0) for i in range(2, 15)]
          data = {"concurso": "1263", "data": "23/07/2026"}
          pair = ("pt-BR-AntonioNeural", "pt-BR-ThalitaNeural")

          install_visual_aprovado()
          assert result_label(mandante) == "COLUNA 1"
          assert result_label(empate) == "EMPATE"
          assert result_label(visitante) == "COLUNA 2"
          assert game_speech(mandante).endswith("Coluna 1.")
          assert game_speech(empate).endswith("Empate.")
          assert game_speech(visitante).endswith("Coluna 2.")
          assert "Vitória" not in game_speech(mandante)

          normalized = _normalize_loteca_speech("Jogo 1. Franca. Portal SimonSports.")
          assert "Jôgo 1" in normalized
          assert "França" in normalized
          assert "Portal Simon Sports" in normalized

          full_segments = _full_segments_natural(data, games, pair)
          short_segments = _short_segments_natural(data, games, pair[0])
          assert "Portal Simon Sports, simplesmente o melhor" in full_segments[0].text
          assert full_segments[0].rate == "-10%"
          assert any("Jôgo 1" in segment.text and "França" in segment.text for segment in full_segments)
          assert any("Jôgo 1" in segment.text and "França" in segment.text for segment in short_segments)
          assert full_segments[-1].text == "Portal Simon Sports, simplesmente o melhor."

          game_segments = [segment for segment in full_segments if segment.role == "loteca_game"]
          assert len(game_segments) == 14
          starts = [segment.start for segment in game_segments]
          assert all(abs((b - a) - 9.0) < 0.01 for a, b in zip(starts, starts[1:]))
          assert abs(_game_start(1) - _game_start(0) - 9.0) < 0.01

          assert FINAL_SHORT_DURATION == 104.0
          assert FINAL_FULL_DURATION == 214.0
          assert FINAL_FULL_GAME_SLOT == 9.0
          print("Loteca validada: nove segundos por jogo, cerca de três segundos de respiro, visual e pronúncia preservados.")
          PY

      - name: Gerar Short, vídeo completo e pôster
        env:
          VIDEO_FPS: "30"
        run: |
          rm -rf preview_loteca_v18
          python loteca_preview_v18.py --output-dir preview_loteca_v18
          ls -lh preview_loteca_v18
          test -n "$(find preview_loteca_v18 -maxdepth 1 -name 'short_loteca_*_104s_voz_v18.mp4' -print -quit)"
          test -n "$(find preview_loteca_v18 -maxdepth 1 -name 'video_completo_loteca_*_214s_dialogo_v18.mp4' -print -quit)"
          test -n "$(find preview_loteca_v18 -maxdepth 1 -name 'poster_loteca_*_v18.png' -print -quit)"

      - name: Disponibilizar vídeo da Loteca com intervalo reduzido
        uses: actions/upload-artifact@v4
        with:
          name: videos-loteca-1263-intervalo-3-segundos-${{ github.run_number }}
          path: |
            preview_loteca_v18/*.mp4
            preview_loteca_v18/*.png
          if-no-files-found: error
          retention-days: 14
