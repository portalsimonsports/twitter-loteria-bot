name: Publicação Automática de Loterias

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"  # a cada 10 min (UTC)

concurrency:
  group: publish-loterias
  # Uma execução nova aguarda a anterior. Não cancelar depois de publicar evita
  # repetir um post que foi enviado antes de a planilha receber o Tweet ID.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # =========================
      # DIAGNÓSTICOS INICIAIS
      # =========================
      - name: Mostrar matriz de arquivos e vars
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Arquivos no repo:" && ls -la
          echo "Subpastas:" && find . -maxdepth 2 -type d -print | sort
          echo "Existe data/to_publish.json?"
          test -f data/to_publish.json && cat data/to_publish.json || echo "NÃO ENCONTRADO"

      # =========================
      # GARANTIR output/ no repo
      # =========================
      - name: Garantir pasta output/ + .gitkeep
        run: |
          mkdir -p output
          [ -f output/.gitkeep ] || echo "" > output/.gitkeep
          echo "Pasta output preparada."

      # =========================
      # RENDER (Node + Puppeteer)
      # =========================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar deps do render
        run: |
          if [ -f package.json ]; then
            npm i --silent
          else
            npm init -y >/dev/null 2>&1
            npm i puppeteer@22.13.1 --silent
          fi

      - name: Validar template e assets
        run: |
          test -f templates/post-instagram.html || (echo "templates/post-instagram.html não existe" && exit 1)
          test -d assets/fundos || (echo "assets/fundos ausente. Criando..." && mkdir -p assets/fundos)
          test -d assets/logos  || (echo "assets/logos ausente. Criando..." && mkdir -p assets/logos)

      - name: Instalar jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Conferir se há itens na fila
        id: fila
        run: |
          if [ -f data/to_publish.json ]; then
            N=$(jq 'length' data/to_publish.json || echo 0)
          else
            N=0
          fi
          echo "itens=$N" >> $GITHUB_OUTPUT
          echo "Itens na fila: $N"

      - name: Renderizar imagens (se houver itens)
        if: steps.fila.outputs.itens != '0'
        run: |
          node render.js
          echo "Arquivos gerados em /output:"
          ls -la output || true

      # =========================
      # PYTHON
      # =========================
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache do pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir -r requirements.txt

      - name: Validar sintaxe dos publicadores
        run: |
          python -m py_compile bot.py run_publish.py x_publisher.py

      # =========================
      # CLEANUP OUTPUT
      # =========================
      - name: Limpar/normalizar imagens em output
        if: steps.fila.outputs.itens != '0'
        run: |
          python cleanup_output.py
          echo "Após cleanup, conteúdo de /output:"
          ls -la output || true

      # =========================
      # COMMIT DAS IMAGENS
      # =========================
      - name: Commitar /output (se gerado)
        if: steps.fila.outputs.itens != '0'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add -A output || true
          git commit -m "chore: adiciona imagens geradas (${GITHUB_RUN_NUMBER})" || echo "Nada para commitar"

          git fetch origin $GITHUB_REF_NAME
          git pull --rebase --autostash origin $GITHUB_REF_NAME
          git push origin HEAD:$GITHUB_REF_NAME

      # =========================
      # VALIDAÇÃO DO COFRE
      # =========================
      - name: Verificar secrets mínimos (Google + Cofre)
        env:
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
          COFRE_SHEET_ID: ${{ secrets.COFRE_SHEET_ID || vars.COFRE_SHEET_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          need = ["GOOGLE_SERVICE_JSON", "COFRE_SHEET_ID"]
          missing = [key for key in need if not os.getenv(key)]
          if missing:
              print("FALTAM CONFIGURAÇÕES:", missing)
              sys.exit(1)

          try:
              json.loads(os.environ["GOOGLE_SERVICE_JSON"])
          except Exception as exc:
              print("GOOGLE_SERVICE_JSON inválido:", exc)
              sys.exit(1)

          print("Google e Cofre configurados.")
          PY

      # =========================
      # PUBLICAÇÃO
      # =========================
      - name: Executar publicador automático
        env:
          # Google
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || '16NcdSwX6q_EQ2XjS1KNIBe6C3Piq-lCBgA38TMszXCI' }}
          SHEET_TAB: ${{ vars.SHEET_TAB || 'ImportadosBlogger2' }}

          # Cofre
          COFRE_SHEET_ID: ${{ secrets.COFRE_SHEET_ID || vars.COFRE_SHEET_ID }}
          COFRE_ABA_CRED: ${{ secrets.COFRE_ABA_CRED || vars.COFRE_ABA_CRED || 'Credenciais_Rede' }}
          COFRE_ABA_CANAIS: ${{ secrets.COFRE_ABA_CANAIS || vars.COFRE_ABA_CANAIS || 'Redes_Sociais_Canais' }}

          # Redes que serão executadas. Vazio = todas as redes suportadas.
          TARGET_NETWORKS: ${{ vars.TARGET_NETWORKS }}

          # Comportamento geral das demais redes
          MAX_PUBLICACOES_RODADA: ${{ vars.MAX_PUBLICACOES_RODADA || '30' }}
          PAUSA_ENTRE_POSTS: ${{ vars.PAUSA_ENTRE_POSTS || '2.5' }}
          POST_TG_WITH_IMAGE: ${{ vars.POST_TG_WITH_IMAGE || 'true' }}
          POST_PINTEREST_WITH_IMAGE: ${{ vars.POST_PINTEREST_WITH_IMAGE || 'true' }}
          POST_FB_WITH_IMAGE: ${{ vars.POST_FB_WITH_IMAGE || 'true' }}

          # X — automação específica e obrigatoriamente protegida
          POST_X_WITH_IMAGE: ${{ vars.POST_X_WITH_IMAGE || 'true' }}
          X_MAX_PUBLICACOES_RODADA: ${{ vars.X_MAX_PUBLICACOES_RODADA || '3' }}
          X_PAUSA_ENTRE_POSTS: ${{ vars.X_PAUSA_ENTRE_POSTS || '60' }}
          X_MAX_PUBLICACOES_24H: ${{ vars.X_MAX_PUBLICACOES_24H || '20' }}
          X_INCLUDE_LINK: ${{ vars.X_INCLUDE_LINK || 'true' }}
          X_INCLUDE_HASHTAG: ${{ vars.X_INCLUDE_HASHTAG || 'true' }}
          X_ACCOUNT_STRATEGY: ${{ vars.X_ACCOUNT_STRATEGY || 'PRIMARY_ONLY' }}
          X_CIRCUIT_HOURS: ${{ vars.X_CIRCUIT_HOURS || '24' }}
          X_CLAIM_TTL_MINUTES: ${{ vars.X_CLAIM_TTL_MINUTES || '60' }}
          X_LEDGER_TAB: ${{ vars.X_LEDGER_TAB || 'X_Publicacoes' }}
          X_STATE_TAB: ${{ vars.X_STATE_TAB || 'X_Estado' }}
          X_SOURCE_LABEL: "${{ vars.X_SOURCE_LABEL || 'Fonte: Loterias CAIXA' }}"
          X_DISCLOSURE_TEXT: "${{ vars.X_DISCLOSURE_TEXT || 'Atualização automática informativa.' }}"

          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          ENABLE_KEEPALIVE: "false"
        run: |
          echo "==== Iniciando run_publish.py ===="
          python run_publish.py
          echo "==== Fim do run_publish.py ===="
