name: Cancelar limpeza legada acionada por ajuste visual
on:
  push:
    paths:
      - .github/workflows/cancelar_limpeza_visual_v36.yml
permissions:
  actions: write
jobs:
  cancelar:
    runs-on: ubuntu-latest
    steps:
      - name: Cancelar somente a execução legada indevida
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/portalsimonsports/twitter-loteria-bot/actions/runs/41614358027/cancel
