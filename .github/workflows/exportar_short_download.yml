name: Exportar Short para download

on:
  push:
    branches:
      - main
    paths:
      - export_short_request.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exportar:
    name: Gerar Short SimonSports para download
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg, fontes e dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation2
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir -r requirements.txt

      - name: Gerar Short da Loteca 1263
        env:
          VIDEO_FPS: "30"
        run: |
          rm -rf export_short
          python loteca_preview_v18.py --output-dir export_short
          SHORT_FILE="$(find export_short -maxdepth 1 -name 'short_loteca_*_104s_voz_v18.mp4' -print -quit)"
          test -n "$SHORT_FILE"
          cp "$SHORT_FILE" export_short/Short_Loteca_1263_SimonSports.mp4
          ls -lh export_short/Short_Loteca_1263_SimonSports.mp4

      - name: Disponibilizar MP4
        uses: actions/upload-artifact@v4
        with:
          name: short-loteca-1263-simonsports-${{ github.run_number }}
          path: export_short/Short_Loteca_1263_SimonSports.mp4
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Registrar execução para entrega no ChatGPT
        run: |
          printf 'run_id=%s\nrun_number=%s\nartifact_name=short-loteca-1263-simonsports-%s\nfile=Short_Loteca_1263_SimonSports.mp4\n' \
            '${{ github.run_id }}' '${{ github.run_number }}' '${{ github.run_number }}' \
            > latest_short_download_run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest_short_download_run.txt
          git commit -m 'chore: registra Short disponível para download' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
