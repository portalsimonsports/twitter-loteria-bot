name: Verificar e publicar resumo diário no YouTube
run-name: Verificação diária YouTube LIVE — ${{ github.event_name }} — execução ${{ github.run_number }}

on:
  repository_dispatch:
    types:
      - resultado_loteria_disponivel
  push:
    branches:
      - main
    paths:
      - data/to_publish_videos.json
      - daily_calendar_api_v21.py
      - pending_alert_fix_v27.py
      - caixa_direct_fallback_v23.py
      - repair_today_alert_v26.py
      - youtube_daily_live_v22.py
      - youtube_daily_live_v22_prize_fix.py
      - youtube_thumbnail_v24.py
      - daily_queue_v19.py
      - daily_queue_v19_policy_fix.py
      - daily_growth_v20.py
      - daily_video_v19.py
      - daily_video_v19_cta_fix.py
      - daily_video_v19_short_fix.py
      - daily_video_v19_dupla_fix.py
      - daily_video_v19_branding_fix.py
      - youtube_auth.py
      - youtube_upload.py
      - requirements.txt
      - .github/workflows/publicar_ultimos_e_proximos.yml
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "Gerar prévia sem publicar ou executar publicação real"
        required: true
        default: prever
        type: choice
        options:
          - prever
          - publicar

permissions:
  contents: read

jobs:
  verificar-e-publicar:
    name: Calendário oficial -> avisos pendentes -> Live -> API CAIXA -> resultado no mesmo URL
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: youtube-loterias-publicacao-diaria
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation2
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir -r requirements.txt

      - name: Validar módulos
        run: |
          python -m py_compile \
            daily_calendar_api_v21.py pending_alert_fix_v27.py caixa_direct_fallback_v23.py repair_today_alert_v26.py \
            youtube_daily_live_v22.py youtube_daily_live_v22_prize_fix.py youtube_thumbnail_v24.py \
            daily_video_v19.py daily_video_v19_cta_fix.py daily_video_v19_short_fix.py \
            daily_video_v19_dupla_fix.py daily_video_v19_branding_fix.py daily_queue_v19.py \
            daily_queue_v19_policy_fix.py daily_growth_v20.py lottery_result_v18.py \
            voice_narration_v18.py voice_narration_v17.py audio_identity_v9.py \
            video_queue.py post_video.py youtube_auth.py youtube_upload.py oauth_youtube.py

      - name: Reparar capa do alerta de hoje sem bloquear o fluxo
        env:
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || '16NcdSwX6q_EQ2XjS1KNIBe6C3Piq-lCBgA38TMszXCI' }}
          SHEET_TAB: ${{ vars.SHEET_TAB || 'ImportadosBlogger2' }}
          COFRE_SHEET_ID: ${{ secrets.COFRE_SHEET_ID || vars.COFRE_SHEET_ID }}
          COFRE_ABA_CRED: ${{ vars.COFRE_ABA_CRED || 'Credenciais_Rede' }}
          YOUTUBE_API_CALENDAR_SHEET_ID: ${{ vars.YOUTUBE_API_CALENDAR_SHEET_ID || '1gHenJLO5Qr23wWLgmRUXHldaDsUdKcICeFR1Ee621X8' }}
          YOUTUBE_API_CALENDAR_TAB: ${{ vars.YOUTUBE_API_CALENDAR_TAB || 'API_CALENDARIO_LOTERIAS' }}
          TZ: America/Sao_Paulo
        run: |
          mkdir -p output
          python repair_today_alert_v26.py

      - name: Executar fluxo diário Live
        env:
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || '16NcdSwX6q_EQ2XjS1KNIBe6C3Piq-lCBgA38TMszXCI' }}
          SHEET_TAB: ${{ vars.SHEET_TAB || 'ImportadosBlogger2' }}
          COFRE_SHEET_ID: ${{ secrets.COFRE_SHEET_ID || vars.COFRE_SHEET_ID }}
          COFRE_ABA_CRED: ${{ vars.COFRE_ABA_CRED || 'Credenciais_Rede' }}
          PUBLICADO_YT_DIARIO_COL: ${{ vars.PUBLICADO_YT_DIARIO_COL || 'Publicado_Youtube_Diario' }}
          YOUTUBE_API_CALENDAR_SHEET_ID: ${{ vars.YOUTUBE_API_CALENDAR_SHEET_ID || '1gHenJLO5Qr23wWLgmRUXHldaDsUdKcICeFR1Ee621X8' }}
          YOUTUBE_API_CALENDAR_TAB: ${{ vars.YOUTUBE_API_CALENDAR_TAB || 'API_CALENDARIO_LOTERIAS' }}
          YOUTUBE_API_HISTORY_CONFIG_TAB: ${{ vars.YOUTUBE_API_HISTORY_CONFIG_TAB || 'CONFIG_HISTORICO_CAIXA' }}
          YOUTUBE_DAILY_LIVE_SCHEDULE_HOUR: ${{ vars.YOUTUBE_DAILY_LIVE_SCHEDULE_HOUR || '21' }}
          YOUTUBE_FORCE_SHORT_SINGLE_LOTTERY: ${{ vars.YOUTUBE_FORCE_SHORT_SINGLE_LOTTERY || 'false' }}
          MAX_VIDEOS_RODADA: "1"
          PAUSA_ENTRE_VIDEOS: ${{ vars.PAUSA_ENTRE_VIDEOS || '3.0' }}
          DRY_RUN_VIDEOS: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'prever' && 'true' || 'false' }}
          VIDEO_FPS: "30"
          TZ: America/Sao_Paulo
        run: |
          mkdir -p output
          python -c "import daily_video_v19_short_fix; import daily_video_v19_dupla_fix; import daily_video_v19_branding_fix; import daily_video_v19_cta_fix; import daily_queue_v19_policy_fix; import daily_growth_v20; import caixa_direct_fallback_v23; import youtube_daily_live_v22; import youtube_daily_live_v22_prize_fix; import daily_calendar_api_v21; import pending_alert_fix_v27; daily_calendar_api_v21.main()"

      - name: Guardar artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resumo-diario-youtube-live-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.png
            output/*.jpg
          if-no-files-found: ignore
          retention-days: 14
